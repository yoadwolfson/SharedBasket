spring.datasource.url=jdbc:postgresql://localhost:5433/sharedbasket_dev
spring.datasource.username=sharedbasket
spring.datasource.password=sharedbasket
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
server.servlet.session.cookie.secure=false

# Authentication policy:
# The dev profile uses CookieAuthenticationService as the canonical AuthenticationService.
# DevAuthenticationService remains disabled as a fallback scaffold and is not active.
