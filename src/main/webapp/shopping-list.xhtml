<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layouts/base-layout.xhtml">
    <ui:param name="pageTitle" value="Shopping List - Shared Basket" />

    <ui:define name="content">
        <div class="sb-shopping-list-container">
            <h2 class="sb-page-title">Shopping List</h2>

            <div class="sb-shopping-content">
                <ui:repeat value="#{shoppingListController.alerts}" var="alert">
                    <div class="sb-alert sb-alert-#{alert.type}">
                        <h:outputText value="#{alert.message}" />
                    </div>
                </ui:repeat>

                <div class="sb-widget" style="margin-bottom:1rem;">
                    <h3 class="sb-widget-title">Realtime Session</h3>
                    <p class="sb-placeholder-text">State: #{shoppingListController.realtimeState}</p>
                    <p class="sb-placeholder-text">Last event: #{shoppingListController.lastEventMessage}</p>
                    <p class="sb-placeholder-text">Last version: #{shoppingListController.lastAppliedVersion}</p>

                    <h:form>
                        <h:outputLabel for="scenario" value="Scenario" />
                        <h:selectOneMenu id="scenario" value="#{shoppingListController.selectedScenario}">
                            <f:selectItem itemValue="ORDERING_EDGE_CASE" itemLabel="Ordering Edge Case" />
                            <f:selectItem itemValue="NORMAL" itemLabel="Normal" />
                        </h:selectOneMenu>
                        <h:outputText value="&#160;" />
                        <h:commandButton value="Connect (Mock)"
                                         action="#{shoppingListController.connectRealtime}"
                                         styleClass="sb-btn sb-btn-primary" />
                        <h:outputText value="&#160;" />
                        <h:commandButton value="Process Next Event"
                                         action="#{shoppingListController.processNextMockEvent}"
                                         styleClass="sb-btn sb-btn-secondary"
                                         disabled="#{not shoppingListController.connected}" />
                        <h:outputText value="&#160;" />
                        <h:commandButton value="Refresh Snapshot"
                                         action="#{shoppingListController.refreshSnapshot}"
                                         styleClass="sb-btn sb-btn-secondary" />
                        <h:outputText value="&#160;" />
                        <h:commandButton value="Reconnect"
                                         action="#{shoppingListController.reconnectRealtime}"
                                         styleClass="sb-btn sb-btn-secondary" />
                        <h:outputText value="&#160;" />
                        <h:commandButton value="Disconnect"
                                         action="#{shoppingListController.disconnectRealtime}"
                                         styleClass="sb-btn sb-btn-secondary" />
                    </h:form>
                </div>

                <div class="sb-widget">
                    <h3 class="sb-widget-title">Current Items</h3>
                    <h:panelGroup rendered="#{empty shoppingListController.shoppingItems}">
                        <p class="sb-placeholder-text">No items available.</p>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not empty shoppingListController.shoppingItems}">
                        <table class="sb-table" style="width:100%;">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Quantity</th>
                                    <th>Estimated Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <ui:repeat value="#{shoppingListController.shoppingItems}" var="item">
                                    <tr>
                                        <td><h:outputText value="#{item.name}" /></td>
                                        <td><h:outputText value="#{item.quantity}" /></td>
                                        <td><h:outputText value="#{item.estimatedPrice}" /></td>
                                    </tr>
                                </ui:repeat>
                            </tbody>
                        </table>
                    </h:panelGroup>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>

</html>
