<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layouts/base-layout.xhtml">
    <ui:param name="pageTitle" value="Login - Shared Basket" />

    <ui:define name="content">
        <div class="sb-login-container">
            <h2 class="sb-page-title">Login</h2>
            <div class="sb-widget">
                <h:form id="loginForm">
                    <h:messages globalOnly="true" styleClass="sb-error-message" errorStyle="color:red;" />
                    <div class="sb-form-group">
                        <h:outputLabel for="email" value="Email" />
                        <h:inputText id="email" value="#{loginBean.email}" styleClass="sb-form-control" />
                    </div>
                    <div class="sb-form-group">
                        <h:outputLabel for="password" value="Password" />
                        <h:inputSecret id="password" value="#{loginBean.password}" styleClass="sb-form-control" />
                    </div>
                    <h:commandButton value="Sign in" action="#{loginBean.login}" styleClass="sb-btn sb-btn-primary" />
                    <h:outputLink value="#{request.contextPath}/register.xhtml" styleClass="sb-btn sb-btn-secondary">
                        Create account
                    </h:outputLink>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>

</html>
