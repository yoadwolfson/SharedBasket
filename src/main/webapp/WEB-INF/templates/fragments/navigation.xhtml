<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>
    <!-- Main Navigation Fragment for Shared Basket
         This fragment provides primary navigation across the application.
         Navigation visibility and permissions are controlled by role-based access. -->
    
    <nav class="sb-main-nav" role="navigation">
        <div class="sb-nav-container">
            <!-- DEV-A Connection Point: Role-based Navigation Display -->
            <!-- @DevAConnection Provider=DeveloperA, Service=AuthenticationService, Type=RoleProvider
                 Context: Navigation items visibility depends on user role (Admin/Member).
                 Integration: Expect #{sessionScope.currentUser.role} to contain role information from Developer A.
                 Expected Values: "ADMIN" | "MEMBER" from Developer A's role enum. -->
            
            <ul class="sb-nav-menu">
                <!-- Dashboard - Available to all authenticated users -->
                <li class="sb-nav-item">
                    <h:outputLink value="#{request.contextPath}/dashboard.xhtml"
                                   styleClass="sb-nav-link">
                        📊 Dashboard
                    </h:outputLink>
                </li>
                
                <!-- Shopping List - Available to all authenticated users -->
                <li class="sb-nav-item">
                    <h:outputLink value="#{request.contextPath}/shopping-list.xhtml"
                                   styleClass="sb-nav-link">
                        🛒 Shopping List
                    </h:outputLink>
                </li>
                
                <!-- Group Management - Available to all authenticated users -->
                <li class="sb-nav-item">
                    <h:outputLink value="#{request.contextPath}/groups.xhtml"
                                   styleClass="sb-nav-link">
                        👥 Groups
                    </h:outputLink>
                </li>
                
                <!-- Statistics & Reporting - Available to all authenticated users -->
                <li class="sb-nav-item">
                    <h:outputLink value="#{request.contextPath}/reports.xhtml"
                                   styleClass="sb-nav-link">
                        📈 Reports
                    </h:outputLink>
                </li>
                
                <!-- Recommendations - Available to all authenticated users -->
                <li class="sb-nav-item">
                    <h:outputLink value="#{request.contextPath}/recommendations.xhtml"
                                   styleClass="sb-nav-link">
                        💡 Recommendations
                    </h:outputLink>
                </li>
                
                <!-- Admin Section - Only visible to ADMIN role -->
                <li class="sb-nav-item sb-nav-divider">
                    <span class="sb-nav-section-title">Administration</span>
                </li>
                
                <li class="sb-nav-item">
                    <a href="#" class="sb-nav-link">🔐 Manage Members</a>
                </li>
            </ul>
        </div>
    </nav>
</ui:composition>

</html>
