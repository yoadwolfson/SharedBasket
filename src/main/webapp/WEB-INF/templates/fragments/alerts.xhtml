<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>
    <!-- Global Alerts & Notifications Fragment
         This fragment displays global error messages, validation errors,
         success notifications, and informational alerts across the application. -->
    
    <div class="sb-alerts-container" id="sb-global-alerts">
        
        <!-- JSF Messages Display (Framework-level validation errors) -->
        <h:messages id="globalMessages" 
                    styleClass="sb-alert-messages"
                    errorClass="sb-alert sb-alert-error"
                    warnClass="sb-alert sb-alert-warning"
                    infoClass="sb-alert sb-alert-info"
                    layout="table"
                    showSummary="true"
                    showDetail="true" />
        
        <!-- Form Validation Errors by Field -->
        <h:panelGroup layout="block" styleClass="sb-field-errors-container" rendered="#{not empty facesContext.messageList}">
            <div class="sb-alert sb-alert-error">
                <h4 class="sb-alert-title">Validation Errors</h4>
                <ul class="sb-error-list">
                    <ui:repeat var="msg" value="#{facesContext.messageList}">
                        <li class="sb-error-item">
                            <strong>#{msg.clientId}:</strong> #{msg.summary}
                        </li>
                    </ui:repeat>
                </ul>
            </div>
        </h:panelGroup>
        
        <!-- DEV-A Connection Point: Business Logic Errors -->
        <!-- @DevAConnection Provider=DeveloperA, Service=Various, Type=ErrorResponse
             Context: Backend validation errors from Developer A services are rendered here.
             Integration: Error details wrapped in ErrorResponseDTO (see dto/ErrorResponseDTO.java).
             Expected Shape: {fieldName: String, message: String, errorCode: String} array. -->
        
        <!-- Application Alerts (controlled by shell controller) -->
        <h:panelGroup layout="block">
            <ui:repeat var="alert" value="#{shellController.applicationAlerts}">
                <div class="sb-alert sb-alert-#{alert.type}">
                    <button type="button" class="sb-alert-close" onclick="this.parentElement.style.display='none'">×</button>
                    <h:outputText value="#{alert.message}" escape="false" />
                </div>
            </ui:repeat>
        </h:panelGroup>
    </div>
</ui:composition>

</html>
