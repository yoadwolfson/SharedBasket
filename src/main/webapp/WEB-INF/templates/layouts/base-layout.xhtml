<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="pageTitle">Shared Basket</ui:insert>
    </title>
    
    <!-- Stylesheets -->
    <h:outputStylesheet library="css" name="bootstrap.min.css" />
    <h:outputStylesheet library="css" name="base-layout.css" />
    <h:outputStylesheet library="css" name="components.css" />
    <ui:insert name="additionalStyles" />
</h:head>

<h:body styleClass="sb-app-body">
    <!-- DEV-A Connection Point: Authentication & Session State -->
    <!-- @DevAConnection Provider=DeveloperA, Service=AuthenticationService, Type=SessionInjection
         Context: Shell expects authenticated user session from Developer A's authentication layer.
         Integration: Use managed bean injection from Developer A's authentication provider. -->
    
    <div id="sb-app-container" class="sb-app-container">
        <!-- Header Section -->
        <ui:include src="/WEB-INF/templates/fragments/header.xhtml" />
        
        <!-- Main Navigation -->
        <ui:include src="/WEB-INF/templates/fragments/navigation.xhtml" />
        
        <!-- Global Alerts & Notifications -->
        <ui:include src="/WEB-INF/templates/fragments/alerts.xhtml" />
        
        <!-- Main Content Area -->
        <main class="sb-main-content">
            <div class="sb-page-wrapper">
                <ui:insert name="content">
                    <!-- Page-specific content goes here -->
                </ui:insert>
            </div>
        </main>
        
        <!-- Footer Section -->
        <ui:include src="/WEB-INF/templates/fragments/footer.xhtml" />
    </div>
    
    <!-- Scripts -->
    <h:outputScript library="js" name="jquery.min.js" />
    <h:outputScript library="js" name="bootstrap.min.js" />
    <h:outputScript library="js" name="shell-ui.js" />
    <ui:insert name="additionalScripts" />
</h:body>

</html>
