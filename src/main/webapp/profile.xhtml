<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layouts/base-layout.xhtml">
    <ui:param name="pageTitle" value="Profile - Shared Basket" />

    <ui:define name="content">
        <div class="sb-login-container">
            <h2 class="sb-page-title">Profile</h2>
            <div class="sb-widget">
                <h:form id="profileForm">
                    <div class="sb-form-group">
                        <h:outputLabel for="email" value="Email" />
                        <h:outputText id="email" value="#{profileBean.email}" />
                    </div>
                    <div class="sb-form-group">
                        <h:outputLabel for="username" value="Username" />
                        <h:inputText id="username" value="#{profileBean.username}" styleClass="sb-form-control" />
                    </div>
                    <div class="sb-form-group">
                        <h:outputLabel for="firstName" value="First name" />
                        <h:inputText id="firstName" value="#{profileBean.firstName}" styleClass="sb-form-control" />
                    </div>
                    <div class="sb-form-group">
                        <h:outputLabel for="lastName" value="Last name" />
                        <h:inputText id="lastName" value="#{profileBean.lastName}" styleClass="sb-form-control" />
                    </div>
                    <h:commandButton value="Save" action="#{profileBean.save}" styleClass="sb-btn sb-btn-primary" />
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>

</html>
