Spring Boot Configuration
spring.application.name=shared-basket

Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.register-default-servlet=true

JSF Facelets Configuration - Allow FacesServlet to handle these
javax.faces.PROJECT_STAGE=Development
org.apache.myfaces.PRETTY_HTML=true
org.apache.myfaces.CACHE_EL_EXPRESSIONS=default
org.apache.myfaces.USE_FLASH_SCOPE_PURGING_MECHANISM=false

Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:sharedbasket
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

H2 Console (optional - for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

Logging
logging.level.root=INFO
logging.level.com.sharedbasket=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO